[package]
name = "codepapr-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "CodePapr core engine: filesystem, git, shell, lsp, tree-sitter, db, sidecar runtime"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "net", "io-util"] }
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
ignore = "0.4"
notify = "6"
regex = "1"
encoding_rs = "0.8"
scraper = "0.20"
flate2 = "1"
tar = "0.4"
xz2 = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
bitflags = "2"
rmcp = { version = "1.7.0", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "macros"] }
base64 = "0.22"
futures-util = "0.3"
hex = "0.4"
rand = "0.8"
zeroize = "1"
toml = "0.8"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "cookies", "gzip", "brotli", "deflate", "stream", "json"] }
url = "2"

tree-sitter = "0.27"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-java = "0.23"
tree-sitter-go = "0.25"
tree-sitter-cpp = "0.23"
tree-sitter-bash = "0.25"
tree-sitter-php = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-css = "0.25"
tree-sitter-html = "0.23"
tree-sitter-json = "0.24"
tree-sitter-ruby = "0.23"
# crates.io 仍停在 0.3.x（旧 language() API + tree-sitter 0.20）。0.4 已发布到 GitHub。
tree-sitter-kotlin = { git = "https://github.com/fwcd/tree-sitter-kotlin" }
tree-sitter-swift = "0.7"
tree-sitter-sql = { version = "0.3", package = "tree-sitter-sequel" }
