[package]
name = "codepapr"
version = "0.1.0"
description = "CodePapr - DeepSeek Cache-Optimized Agent"
authors = ["CodePapr"]
license = "MIT"
repository = ""
edition = "2021"
default-run = "codepapr"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde_json = "1"
flate2 = "1"
tar = "0.4"
xz2 = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-prevent-default = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
headless_chrome = "1.0.21"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "cookies", "gzip", "brotli", "deflate"] }
reqwest_0_13_tls = { package = "reqwest", version = "0.13.3", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
ignore = "0.4"
regex = "1"
scraper = "0.20"
flate2 = "1"
tar = "0.4"
xz2 = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
bitflags = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time"] }
rmcp = { version = "1.7.0", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "macros"] }
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
rodio = { version = "0.20", default-features = false, features = ["wav"] }
base64 = "0.22"
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
tauri-plugin-stronghold = { version = "2", features = ["kdf"] }
rand = "0.8"
zeroize = "1"
toml = "0.8"

tree-sitter = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-java = "0.23"
tree-sitter-go = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-bash = "0.23"

tree-sitter-php = { path = "../../../../.cargo-vendor/php" }

tree-sitter-c-sharp = { path = "../../../../.cargo-vendor/c-sharp" }
tree-sitter-css = { path = "../../../../.cargo-vendor/css" }
tree-sitter-html = { path = "../../../../.cargo-vendor/html" }
tree-sitter-json = { path = "../../../../.cargo-vendor/json" }

tree-sitter-ruby = { path = "../../../../.cargo-vendor/ruby" }

tree-sitter-kotlin = { path = "../../../../.cargo-vendor/kotlin" }

tree-sitter-swift = { path = "../../../../.cargo-vendor/swift" }

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
protocol-asset = ["tauri/protocol-asset"]

[profile.release]
opt-level = 3           # Maximum compiler optimization level
lto = true              # Enable fat LTO for cross-crate inlining
codegen-units = 1       # Single codegen unit for best global optimization
panic = "abort"         # Remove stack unwinding overhead, smaller binary
strip = true            # Strip debug symbols for faster cold start
