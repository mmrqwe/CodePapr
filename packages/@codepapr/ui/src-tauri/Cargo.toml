[package]
name = "codepapr"
version = "0.1.0"
description = "CodePapr - DeepSeek Cache-Optimized Agent"
authors = ["CodePapr"]
license = "MIT"
repository = ""
edition = "2021"
default-run = "codepapr"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde_json = "1"
flate2 = "1"
tar = "0.4"
xz2 = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"

[dependencies]
# unstable 启用多 WebView API（Window::add_child）——内置浏览器面板依赖。
# pin 版本：unstable API 可能随 minor 版本漂移（tauri 官方建议）。
tauri = { version = "=2.11.2", features = ["protocol-asset", "unstable"] }
tauri-plugin-prevent-default = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
headless_chrome = "1.0.21"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "cookies", "gzip", "brotli", "deflate", "stream"] }
reqwest_0_13_tls = { package = "reqwest", version = "0.13.3", default-features = false, features = ["json", "rustls"] }
url = "2"
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
ignore = "0.4"
notify = "6"
regex = "1"
encoding_rs = "0.8"
scraper = "0.20"
flate2 = "1"
tar = "0.4"
xz2 = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
bitflags = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "net"] }
rmcp = { version = "1.7.0", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "macros"] }
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
rodio = { version = "0.20", default-features = false, features = ["wav"] }
base64 = "0.22"
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
tauri-plugin-stronghold = { version = "2", features = ["kdf"] }
# 与 tauri-plugin-stronghold 的传递依赖同版本（已在 Cargo.lock 中），
# 用于 vault 重加密迁移（KeyProvider/SnapshotPath）与主密钥 hex 编码。
iota_stronghold = "2"
hex = "0.4"
rand = "0.8"
zeroize = "1"
toml = "0.8"

tree-sitter = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-java = "0.23"
tree-sitter-go = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-bash = "0.23"

tree-sitter-php = { path = "../../../../.cargo-vendor/php" }

tree-sitter-c-sharp = { path = "../../../../.cargo-vendor/c-sharp" }
tree-sitter-css = { path = "../../../../.cargo-vendor/css" }
tree-sitter-html = { path = "../../../../.cargo-vendor/html" }
tree-sitter-json = { path = "../../../../.cargo-vendor/json" }

tree-sitter-ruby = { path = "../../../../.cargo-vendor/ruby" }

tree-sitter-kotlin = { path = "../../../../.cargo-vendor/kotlin" }

tree-sitter-swift = { path = "../../../../.cargo-vendor/swift" }

# vendor 自 crates.io tree-sitter-sequel 0.3.11（DerekStride/tree-sitter-sql），
# sha256: 9d198ad3c319c02e43c21efa1ec796b837afcb96ffaef1a40c1978fbdcec7d17
tree-sitter-sql = { path = "../../../../.cargo-vendor/sql", package = "tree-sitter-sequel" }

# 内置浏览器截图：WKWebView.takeSnapshot + NSBitmapImageRep 编码。
# 版本与依赖树中现有 objc2 系列保持一致（wry/tauri 传递依赖）。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSString", "NSError", "NSThread"] }
objc2-app-kit = { version = "0.3", features = ["NSBitmapImageRep", "NSImage", "NSColor", "NSGraphicsContext", "NSImageRep", "objc2-core-graphics"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKSnapshotConfiguration", "block2"] }
objc2-core-graphics = { version = "0.3", features = ["CGImage", "CGColorSpace"] }
block2 = "0.6"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
protocol-asset = ["tauri/protocol-asset"]

[profile.release]
opt-level = 3           # Maximum compiler optimization level
lto = true              # Enable fat LTO for cross-crate inlining
codegen-units = 1       # Single codegen unit for best global optimization
panic = "abort"         # Remove stack unwinding overhead, smaller binary
strip = true            # Strip debug symbols for faster cold start
